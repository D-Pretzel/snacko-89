<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>A-Flight Snacko Store</title>

<!-- Both are the 89th FTS patch. favicon-64 is cropped tighter so it still
     reads at the 16px a browser tab actually draws. -->
<link rel="icon" href="favicon-64.png" />
<link rel="apple-touch-icon" href="icon-192.png" />

<!-- ============================================================= -->
<!--  The menu lives in menu.json, not in this file.                -->
<!--  Edit it from admin.html, or edit menu.json directly on GitHub. -->
<!-- ============================================================= -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg:     #F3EFE5;
    --panel:  #FBF8F0;
    --ink:    #1A1C22;
    --muted:  #7A7365;
    --rule:   #CFC8B7;
    --rule-2: #E6E1D2;
    --accent: #D96B4A;         /* warm coral — used for pay + minus hover */
    --accent-press: #B7532F;
    --accent-tint: #FBEAE0;
    --blue: #3A7BD5;           /* selection blue — active row + plus hover */
    --blue-tint: #E4EEFB;
    /* Search-hit highlight. Deliberately not --blue-tint: that is tuned to sit
       against --bg for the selected-row fill, and a <mark> sits against
       --panel, where it needs more separation to read. */
    --hit: #CFE0F7;
    --venmo: #008CFF;
    --paypal: #0070BA;
    --shadow: 0 1px 2px rgba(20,22,26,.04), 0 6px 18px rgba(20,22,26,.05);
    --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:     #14161A;
      --panel:  #1D2026;
      --ink:    #EFE9DA;
      --muted:  #8F8877;
      --rule:   #3B3E46;
      --rule-2: #292C33;
      --accent-tint: #3A2018;
      --blue-tint: #172436;
      --hit: #2C4A6B;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
    }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.35;
    -webkit-font-smoothing: antialiased;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
  }

  /* The bottom padding is a starting guess only — the script measures the bar
     and overwrites it, because a fixed number cannot know how tall the bar
     actually is and the last rows end up unreachable behind it when it grows. */
  .wrap { max-width: 520px; margin: 0 auto; padding: 22px 18px 180px; }

  /* Header */
  header {
    display: flex; align-items: center; gap: 14px;
    padding: 4px 4px 20px;
    margin-bottom: 14px;
    border-bottom: 1px solid var(--rule);
  }
  .mark { width: 56px; height: 56px; object-fit: contain; flex: 0 0 56px; }
  h1 {
    font-size: 26px; font-weight: 700; letter-spacing: -.015em;
    margin: 0; line-height: 1;
  }

  /* Search */
  .search {
    display: flex; align-items: center; gap: 8px;
    padding: 0 12px;
    margin-bottom: 12px;
    background: var(--panel);
    border: 1px solid var(--rule-2);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    transition: border-color .18s ease;
  }
  .search:focus-within { border-color: var(--blue); }
  .search[hidden] { display: none; }

  .search-icon { flex: 0 0 auto; width: 16px; height: 16px; color: var(--muted); }

  #searchInput {
    flex: 1 1 auto; min-width: 0;
    border: none; outline: none; background: transparent;
    color: var(--ink);
    font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    /* 16px is the floor: below it, iOS Safari zooms the page on focus and the
       customer is left pinched in on a menu they then have to scroll sideways. */
    font-size: 16px;
    padding: 13px 0;
  }
  #searchInput::placeholder { color: var(--muted); }
  /* Replaced by .search-clear, so the control matches the rest of the page. */
  #searchInput::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }

  .search-clear {
    flex: 0 0 auto;
    width: 34px; height: 34px; border-radius: 9px;
    border: none; background: transparent; color: var(--muted);
    font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  .search-clear:hover { background: var(--bg); color: var(--ink); }
  .search-clear:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .search-clear[hidden] { display: none; }

  .search-status {
    margin: -2px 0 12px;
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--muted);
  }
  /* Collapses the gap when there is nothing to say, without leaving the live
     region display:none — screen readers announce changes less reliably then. */
  .search-status:empty { margin: 0; }

  mark {
    background: var(--hit);
    color: inherit;   /* never the UA's black-on-yellow, which fights dark mode */
    border-radius: 3px;
    padding: 0 1px;
  }

  /* Category sections */
  .cat + .cat { margin-top: 22px; }
  .cat-head {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 4px 8px;
  }
  .cat-title {
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: 11px; font-weight: 500;
    letter-spacing: .22em; text-transform: uppercase;
    color: var(--muted);
  }
  .cat-rule { flex: 1 1 auto; height: 1px; background: var(--rule-2); }

  /* Item rows — soft cards with ledger interior */
  .list { display: flex; flex-direction: column; gap: 8px; }
  .item {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto auto;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    background: var(--panel);
    border: 1px solid var(--rule-2);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    transition: border-color .18s ease, background .18s ease;
    /* The browser scrolls a focused row to the viewport edge, which is behind
       the fixed bar. --bar-h is kept current by the script. */
    scroll-margin-bottom: calc(var(--bar-h, 180px) + 12px);
  }
  .item.active {
    border-color: var(--blue);
    background: var(--blue-tint);
  }
  /* Author `display: grid` above beats the UA sheet's `[hidden] { display: none }`
     no matter the specificity, so filtered-out rows need this to actually go
     away. Same reason `.search` and `.pay.alt` each carry one. */
  .item[hidden] { display: none; }

  .name-lead {
    display: flex; align-items: baseline; gap: 8px;
    min-width: 0; overflow: hidden;
  }
  .name {
    font-size: 15.5px; font-weight: 550;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    flex: 0 1 auto;
  }
  .lead {
    flex: 1 1 auto; height: 1px; min-width: 12px;
    background-image: radial-gradient(circle, var(--rule) 1px, transparent 1.2px);
    background-size: 6px 2px; background-repeat: repeat-x;
    background-position: left center;
    transform: translateY(-3px);
  }
  .price {
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: 14px; font-weight: 500;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
  }

  /* Description — muted second line under the name */
  .name-block { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .desc {
    font-size: 12.5px; color: var(--muted);
    overflow: hidden; text-overflow: ellipsis;
  }

  /* Sale pricing — stacked so the tag never steals width from the item name */
  .price-block { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
  .price-line { display: flex; align-items: baseline; gap: 7px; }
  .price.was {
    color: var(--muted);
    text-decoration: line-through;
    font-size: 12.5px;
  }
  .sale-tag {
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: 10px; font-weight: 500; letter-spacing: .08em;
    color: var(--accent);
    background: var(--accent-tint);
    border-radius: 6px;
    padding: 2px 5px;
    white-space: nowrap;
  }

  /* Stepper — friendlier rounded, but still POS-clean */
  .qty { display: flex; align-items: center; gap: 6px; }
  .qty button {
    width: 34px; height: 34px; border-radius: 9px;
    border: 1px solid var(--rule); background: var(--bg);
    color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 18px; font-weight: 500;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; padding: 0;
    transition: background .15s ease, opacity .15s ease, border-color .15s ease;
  }
  .qty button:hover { background: var(--panel); }
  .qty .plus:hover  { border-color: var(--blue); }
  .qty .minus:hover { border-color: var(--accent); }
  .qty .plus:focus-visible  { outline: 2px solid var(--blue);   outline-offset: 2px; }
  .qty .minus:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .qty .minus[disabled] {
    opacity: .35; pointer-events: none; border-color: var(--rule-2);
  }
  .qty .q-num {
    min-width: 20px; text-align: center;
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: 14px; font-weight: 500;
    font-variant-numeric: tabular-nums;
  }

  /* Loading + error states */
  .state {
    padding: 28px 18px; text-align: center;
    background: var(--panel);
    border: 1px solid var(--rule-2);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }
  .state p { margin: 0 0 4px; }
  .state .hint { font-size: 13px; color: var(--muted); }
  .retry {
    margin-top: 16px;
    padding: 11px 20px; border-radius: 10px;
    border: 1px solid var(--rule); background: var(--bg); color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif; font-size: 15px; font-weight: 500;
    cursor: pointer;
  }
  .retry:hover { border-color: var(--accent); }
  .retry:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Sticky totals bar.

     This covers the menu on a phone, so it is kept as short as it can be
     without shrinking anything you have to read or hit. Most of the saving
     comes from setting the two pay buttons side by side instead of stacking
     them: that is one button height and one gap removed. The rest is the
     item count and the total sharing one line rather than two. */
  .bar {
    position: fixed; left: 0; right: 0; bottom: 0;
    /* env() is 0 on anything without a home indicator, so the bottom value has
       to stand on its own there rather than relying on the inset. */
    padding: 10px 18px calc(12px + env(safe-area-inset-bottom));
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: saturate(180%) blur(14px);
    -webkit-backdrop-filter: saturate(180%) blur(14px);
    border-top: 1px solid var(--rule);
  }
  .bar .inner { max-width: 520px; margin: 0 auto; }
  /* Set while the on-screen keyboard is up. visibility, not display, so the
     bar keeps its box and the measured clearance below stays correct. */
  .bar.kb-hidden { visibility: hidden; }

  /* Count and total on one line. The dashed rule stays — it is the ledger
     language the rest of the page is built on. */
  .totals {
    display: flex; justify-content: space-between; align-items: baseline;
    gap: 12px;
    padding-bottom: 8px; margin-bottom: 10px;
    border-bottom: 1px dashed var(--rule);
  }
  .totals .items {
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
  }
  .totals .grand {
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: 23px; font-weight: 600;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
  }

  .pay-row { display: flex; gap: 10px; }

  .pay {
    flex: 1 1 0; min-width: 0;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    /* 52px clears the 44px minimum tap target with room to spare, and is what
       holds the button height up when the padding comes down. */
    min-height: 52px;
    padding: 14px 16px;
    border: none; border-radius: 14px;
    background: var(--ink); color: var(--bg);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 16px; font-weight: 600;
    letter-spacing: .03em;
    white-space: nowrap;
    text-decoration: none; cursor: pointer;
    transition: background .18s ease, color .18s ease;
  }
  .pay:hover { background: var(--venmo); color: #fff; }
  .pay:focus-visible { outline: 2px solid var(--venmo); outline-offset: 2px; }
  .pay.disabled { background: var(--rule); color: var(--muted); pointer-events: none; }

  /* PayPal is the secondary option, so it is outlined rather than filled —
     two solid slabs are easy to confuse at a glance. The 1px border is taken
     out of the padding so both buttons end up the same height. */
  .pay.alt {
    padding: 13px 15px;
    border: 1px solid var(--rule);
    background: transparent; color: var(--ink);
    transition: background .18s ease, color .18s ease, border-color .18s ease;
  }
  .pay.alt:hover { background: var(--paypal); color: #fff; border-color: var(--paypal); }
  .pay.alt:focus-visible { outline-color: var(--paypal); }
  .pay.alt.disabled { background: transparent; border-color: var(--rule); color: var(--muted); opacity: .65; }
  /* With no PayPal handle set, Venmo flexes out to the full width on its own. */
  .pay.alt[hidden] { display: none; }

  .venmo-logo, .paypal-logo {
    width: 24px; height: 24px; flex: 0 0 24px;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 7px; padding: 2px;
    background: transparent;
    transition: background .18s ease;
  }
  .venmo-logo img, .paypal-logo img { width: 100%; height: 100%; display: block; }
  .pay:hover .venmo-logo { background: #fff; }
  .pay.disabled .venmo-logo, .pay.disabled .paypal-logo { opacity: .5; }

  /* The PayPal monogram is dark blue on transparent, which disappears against
     the dark-mode bar and against the blue hover fill, so it keeps a white
     chip behind it in every state. */
  .paypal-logo { background: #fff; padding: 3px; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <img class="mark" src="89th-logo.png" alt="89th Flying Training Squadron emblem" />
      <h1>A-Flight Snacko Store</h1>
    </header>

    <!-- Deliberately not sticky. The pay bar already takes fixed space at the
         bottom; a second fixed strip would take back what that one gave up.
         Hidden entirely on a short menu, where scrolling beats typing. -->
    <div class="search" id="searchWrap" hidden>
      <!-- Inline rather than a glyph: U+2315 and friends are missing from
           enough phone fonts to show up as a blank or a tofu box. -->
      <svg class="search-icon" viewBox="0 0 16 16" aria-hidden="true"
           fill="none" stroke="currentColor" stroke-width="1.6">
        <circle cx="6.8" cy="6.8" r="4.3" />
        <path d="M10 10 L14 14" stroke-linecap="round" />
      </svg>
      <input type="search" id="searchInput" placeholder="Search items"
             aria-label="Search the menu by item name"
             autocomplete="off" autocorrect="off" autocapitalize="off"
             spellcheck="false" enterkeyhint="search" />
      <button type="button" class="search-clear" id="searchClear" aria-label="Clear search" hidden>✕</button>
    </div>
    <p class="search-status" id="searchStatus" role="status" aria-live="polite"></p>

    <div id="menu">
      <div class="state"><p>Loading menu…</p></div>
    </div>

    <div class="state" id="noResults" hidden>
      <p>No items match <span id="noResultsQuery"></span>.</p>
      <p class="hint">Try a shorter word, or clear the search.</p>
    </div>
  </div>

  <div class="bar">
    <div class="inner">
      <div class="totals">
        <span class="items"><span id="count">0</span> <span id="countLabel">items</span></span>
        <span class="grand" id="total">$0.00</span>
      </div>
      <!-- The visible labels are just the brand, since the total sits directly
           above and both buttons carry their mark. aria-label keeps the full
           phrase for screen readers. -->
      <div class="pay-row">
        <a class="pay alt disabled" id="paypalBtn" href="#" aria-label="Pay with PayPal" hidden>
          <span class="paypal-logo" aria-hidden="true">
            <img src="paypal-mark.png" alt="" />
          </span>
          <span>PayPal</span>
        </a>
        <a class="pay disabled" id="payBtn" href="#" aria-label="Pay with Venmo">
          <span class="venmo-logo" aria-hidden="true">
            <img src="venmo-logo.png" alt="" />
          </span>
          <span>Venmo</span>
        </a>
      </div>
    </div>
  </div>

<script>
  const money = n => "$" + n.toFixed(2);

  /* Today as YYYY-MM-DD in local time, so a sale ending "today" is still on. */
  function todayLocalISO() {
    const d = new Date();
    const pad = n => String(n).padStart(2, "0");
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }

  /* An expired sale is ignored, not removed from the file. */
  function activeSale(item) {
    const s = item.sale;
    if (!s || typeof s.percentOff !== "number") return null;
    if (!(s.percentOff >= 1 && s.percentOff <= 99)) return null;
    if (s.until && String(s.until) < todayLocalISO()) return null;
    return s;
  }

  function effectivePrice(item) {
    const s = activeSale(item);
    if (!s) return item.price;
    return Math.round(item.price * (1 - s.percentOff / 100) * 100) / 100;
  }

  const menuEl  = document.getElementById("menu");
  const totalEl = document.getElementById("total");
  const countEl = document.getElementById("count");
  const countLabelEl = document.getElementById("countLabel");
  const payBtn  = document.getElementById("payBtn");
  const paypalBtn = document.getElementById("paypalBtn");

  const searchWrap   = document.getElementById("searchWrap");
  const searchInput  = document.getElementById("searchInput");
  const searchClear  = document.getElementById("searchClear");
  const searchStatus = document.getElementById("searchStatus");
  const noResults    = document.getElementById("noResults");
  const noResultsQ   = document.getElementById("noResultsQuery");

  /* Below this, scrolling the list is quicker than reaching for the keyboard,
     and the field is just clutter. The menu is snacko-editable, so this is
     re-evaluated on every render rather than decided once. */
  const SEARCH_MIN_ITEMS = 15;

  let state = [];
  let venmoUsername = "";
  /* PayPal.me handle, without the "@" or any URL around it — the bit after
     paypal.me/ in your link. It lives in menu.json alongside the Venmo
     username and is set from admin.html, so it survives a change of snacko
     without anyone editing this file. Empty hides the PayPal button entirely
     and leaves Venmo as the only way to pay.
     PayPal.me prefills the amount but has no field for a note, so the
     itemized list only ever rides along on Venmo payments. */
  let paypalHandle = "";
  let standName = "";

  /* One record per rendered row: { row, section, nameEl, original, folded, map }.
     Rebuilt by render(), read by applyFilter(). Filtering only toggles `hidden`
     on rows that already exist — it never re-renders, because quantities live
     in a closure created by itemRow() and re-rendering would silently reset
     every one of them mid-shop. */
  let searchIndex = [];

  function el(tag, className, text) {
    const n = document.createElement(tag);
    if (className) n.className = className;
    if (text !== undefined) n.textContent = text;
    return n;
  }

  function showState(message, hint, withRetry) {
    state = [];
    searchIndex = [];
    searchWrap.hidden = true;
    searchInput.value = "";
    searchClear.hidden = true;
    searchStatus.textContent = "";
    noResults.hidden = true;
    updateTotals();
    menuEl.replaceChildren();
    const box = el("div", "state");
    box.appendChild(el("p", null, message));
    if (hint) box.appendChild(el("p", "hint", hint));
    if (withRetry) {
      const btn = el("button", "retry", "Try again");
      btn.addEventListener("click", load);
      box.appendChild(btn);
    }
    menuEl.appendChild(box);
  }

  function render(menu) {
    state = [];
    searchIndex = [];
    menuEl.replaceChildren();
    document.title = menu.name || "A-Flight Snacko Store";
    const h1 = document.querySelector("h1");
    if (menu.name) h1.textContent = menu.name;
    venmoUsername = menu.venmoUsername || "";
    paypalHandle = (menu.paypalHandle || "").trim();
    standName = menu.name || "";

    let anyVisible = false;

    (menu.categories || []).forEach(cat => {
      const items = (cat.items || []).filter(it => !it.hidden);
      if (items.length === 0) return;   // skip empty categories
      anyVisible = true;

      const section = el("section", "cat");
      const head = el("div", "cat-head");
      head.appendChild(el("span", "cat-title", cat.label || ""));
      const rule = el("span", "cat-rule");
      rule.setAttribute("aria-hidden", "true");
      head.appendChild(rule);
      section.appendChild(head);

      const list = el("div", "list");
      items.forEach(item => {
        const entry = { name: item.name, price: effectivePrice(item), qty: 0 };
        state.push(entry);
        const row = itemRow(item, entry);
        /* Folded once here, so a keystroke costs only indexOf over these. */
        const folded = foldWithMap(item.name);
        searchIndex.push({
          row, section,
          nameEl: row.querySelector(".name"),
          original: item.name,
          folded: folded.text,
          map: folded.map,
        });
        list.appendChild(row);
      });
      section.appendChild(list);
      menuEl.appendChild(section);
    });

    if (!anyVisible) {
      showState("Nothing for sale right now.", "Check back soon.", false);
      return;
    }

    searchWrap.hidden = searchIndex.length < SEARCH_MIN_ITEMS;
    if (searchWrap.hidden) searchInput.value = "";
    applyFilter();          /* re-applies any live query across a menu reload */
    updateTotals();
  }

  function itemRow(item, entry) {
    const row = el("div", "item");

    /* Name (+ optional description) */
    const nameBlock = el("div", "name-block");
    const nameLead = el("span", "name-lead");
    nameLead.appendChild(el("span", "name", item.name));
    const lead = el("span", "lead");
    lead.setAttribute("aria-hidden", "true");
    nameLead.appendChild(lead);
    nameBlock.appendChild(nameLead);
    if (item.description && String(item.description).trim() !== "") {
      nameBlock.appendChild(el("span", "desc", item.description));
    }
    row.appendChild(nameBlock);

    /* Price, with sale treatment when one is running */
    const sale = activeSale(item);
    const priceBlock = el("div", "price-block");
    if (sale) {
      priceBlock.appendChild(el("span", "sale-tag", sale.percentOff + "% OFF"));
      const line = el("span", "price-line");
      line.appendChild(el("span", "price was", item.price.toFixed(2)));
      line.appendChild(el("span", "price", entry.price.toFixed(2)));
      priceBlock.appendChild(line);
    } else {
      priceBlock.appendChild(el("span", "price", entry.price.toFixed(2)));
    }
    row.appendChild(priceBlock);

    /* Stepper */
    const qty = el("div", "qty");
    const minus = el("button", "minus", "−");
    minus.setAttribute("aria-label", "Remove one " + item.name);
    minus.disabled = true;
    const num = el("span", "q-num", "0");
    const plus = el("button", "plus", "+");
    plus.setAttribute("aria-label", "Add one " + item.name);
    qty.append(minus, num, plus);
    row.appendChild(qty);

    const sync = () => {
      num.textContent = entry.qty;
      row.classList.toggle("active", entry.qty > 0);
      minus.disabled = entry.qty === 0;
      updateTotals();
    };
    plus.addEventListener("click", () => { entry.qty++; sync(); });
    minus.addEventListener("click", () => { if (entry.qty > 0) entry.qty--; sync(); });

    return row;
  }

  /* ---------------- search ------------------------------------------

     Filtering hides rows, it does not rebuild them. Quantities therefore
     survive every keystroke, and an item hidden by the search still counts
     toward the total and the Venmo note — the totals bar stays the single
     source of truth for what is being bought. Clearing the search brings
     everything back untouched.                                          */

  /* Case and accents folded away, plus a map from each folded character back
     to where it started in the original. Stripping diacritics changes length
     ("café" is five code points decomposed, four folded), so without the map
     the highlight ranges would land off by however many accents preceded them.
     for..of walks code points, so an emoji in a name stays in one piece. */
  function foldWithMap(s) {
    let text = "";
    const map = [];
    let i = 0;
    for (const ch of s) {
      const folded = ch.normalize("NFD").replace(/\p{Diacritic}/gu, "").toLowerCase();
      text += folded;
      /* One entry per UTF-16 code unit, because indexOf() below returns code
         unit offsets. Walking `folded` with for..of instead would push a single
         entry for an emoji that occupies two units, and every index after the
         first emoji in a name would be off by one. */
      for (let k = 0; k < folded.length; k++) map.push(i);
      i += ch.length;
    }
    map.push(s.length);   /* sentinel, so a match running to the end maps back */
    return { text, map };
  }

  function foldQuery(s) {
    return s.normalize("NFD").replace(/\p{Diacritic}/gu, "").toLowerCase();
  }

  /* Every token must appear somewhere in the name, in any order — "bar protein"
     finds "Ready Protein Bar", which a plain substring test would miss.
     Returns the ranges to highlight, or null when the row does not match. */
  function matchRanges(rec, tokens) {
    const ranges = [];
    for (const token of tokens) {
      let from = 0, found = false;
      for (;;) {
        const at = rec.folded.indexOf(token, from);
        if (at === -1) break;
        found = true;
        ranges.push([rec.map[at], rec.map[at + token.length]]);
        from = at + token.length;
      }
      if (!found) return null;
    }
    return mergeRanges(ranges);
  }

  /* Overlapping tokens ("pro" and "protein") would otherwise nest <mark>s. */
  function mergeRanges(ranges) {
    ranges.sort((a, b) => a[0] - b[0]);
    const out = [];
    ranges.forEach(r => {
      const last = out[out.length - 1];
      if (last && r[0] <= last[1]) last[1] = Math.max(last[1], r[1]);
      else out.push([r[0], r[1]]);
    });
    return out;
  }

  /* Built from text nodes. Never innerHTML: item names are free text typed
     into the editor, and the whole page is careful never to parse them as
     HTML. A highlighter is exactly where that guarantee gets lost. */
  function paintName(rec, ranges) {
    const node = rec.nameEl;
    if (!ranges || ranges.length === 0) {
      if (node.firstElementChild || node.textContent !== rec.original) {
        node.textContent = rec.original;
      }
      return;
    }
    node.replaceChildren();
    let at = 0;
    ranges.forEach(([start, end]) => {
      if (start > at) node.appendChild(document.createTextNode(rec.original.slice(at, start)));
      const m = document.createElement("mark");
      m.textContent = rec.original.slice(start, end);
      node.appendChild(m);
      at = end;
    });
    if (at < rec.original.length) {
      node.appendChild(document.createTextNode(rec.original.slice(at)));
    }
  }

  function applyFilter() {
    const raw = searchInput.value.trim();
    const tokens = foldQuery(raw).split(/\s+/).filter(Boolean);
    const searching = tokens.length > 0;

    const perSection = new Map();
    let shown = 0;

    searchIndex.forEach(rec => {
      const ranges = searching ? matchRanges(rec, tokens) : null;
      const hit = !searching || ranges !== null;
      rec.row.hidden = !hit;
      if (hit) shown++;
      perSection.set(rec.section, (perSection.get(rec.section) || 0) + (hit ? 1 : 0));
      paintName(rec, hit ? ranges : null);
    });

    /* A heading with nothing under it reads as a bug. */
    perSection.forEach((count, section) => { section.hidden = count === 0; });

    searchClear.hidden = raw === "";
    noResults.hidden = !(searching && shown === 0);
    if (!noResults.hidden) noResultsQ.textContent = "“" + raw + "”";

    if (!searching) searchStatus.textContent = "";
    else if (shown === 0) searchStatus.textContent = "No matches";
    else searchStatus.textContent = shown + " of " + searchIndex.length + " items";
  }

  /* No debounce, deliberately. The list is tens of rows, so a pass is far
     inside one frame; a delay would only add lag to something already
     instant, and make the results feel like they lag the typing. */
  searchInput.addEventListener("input", applyFilter);
  searchInput.addEventListener("search", applyFilter);  /* Esc / native clear */
  searchInput.addEventListener("keydown", e => {
    if (e.key === "Escape" && searchInput.value !== "") {
      e.preventDefault();
      searchInput.value = "";
      applyFilter();
    }
  });
  searchClear.addEventListener("click", () => {
    searchInput.value = "";
    applyFilter();
    searchInput.focus();
  });

  function updateTotals() {
    const total = state.reduce((s, it) => s + it.qty * it.price, 0);
    const count = state.reduce((s, it) => s + it.qty, 0);
    totalEl.textContent = money(total);
    countEl.textContent = count;
    countLabelEl.textContent = count === 1 ? "item" : "items";

    paypalBtn.hidden = !paypalHandle;

    if (total <= 0) {
      payBtn.classList.add("disabled");
      payBtn.removeAttribute("href");
      paypalBtn.classList.add("disabled");
      paypalBtn.removeAttribute("href");
      return;
    }
    payBtn.classList.remove("disabled");

    /* PayPal.me takes the amount as the last path segment and nothing else —
       no note, no currency argument. With no handle the button is already
       hidden, so leave it without an href rather than building a link to
       paypal.me// that goes nowhere. */
    if (paypalHandle) {
      paypalBtn.classList.remove("disabled");
      paypalBtn.href = `https://paypal.me/${encodeURIComponent(paypalHandle)}/${total.toFixed(2)}`;
    } else {
      paypalBtn.classList.add("disabled");
      paypalBtn.removeAttribute("href");
    }

    /* The query is built by hand rather than with URLSearchParams, which
       encodes spaces as "+" — Venmo shows the note verbatim, plus signs and
       all. encodeURIComponent uses %20, which Venmo renders as a space. */
    const query = [
      "txn=pay",
      "amount=" + encodeURIComponent(total.toFixed(2)),
      "note="   + encodeURIComponent(buildNote()),
    ].join("&");
    payBtn.href = `https://venmo.com/${encodeURIComponent(venmoUsername)}?${query}`;
  }

  /* Reads like a sentence rather than a receipt dump: the "1x" is dropped for
     single items and the last one is joined with "and". */
  function buildNote() {
    const parts = state.filter(it => it.qty > 0)
                       .map(it => (it.qty > 1 ? it.qty + "x " : "") + it.name);

    let list;
    if (parts.length === 1)      list = parts[0];
    else if (parts.length === 2) list = parts[0] + " and " + parts[1];
    else                         list = parts.slice(0, -1).join(", ") + ", and " + parts[parts.length - 1];

    const note = standName ? `${standName}: ${list}` : list;
    /* Venmo caps the note at 280 characters and silently drops the rest. */
    return note.length > 280 ? note.slice(0, 277) + "..." : note;
  }

  async function load() {
    showState("Loading menu…", null, false);
    try {
      /* Cache-busted: GitHub Pages sits behind a CDN, and without this a price
         change can take several minutes to show up. */
      const res = await fetch(`menu.json?v=${Date.now()}`, { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const menu = await res.json();
      if (!menu || !Array.isArray(menu.categories)) throw new Error("Malformed menu");
      render(menu);
    } catch (err) {
      showState(
        "Couldn't load the menu.",
        "Check your connection and try again. (" + err.message + ")",
        true
      );
    }
  }

  /* The bar is fixed, so the list needs clearance under it or the last rows
     sit behind the buttons — close enough to look tappable, but the tap lands
     on the bar. The height is not a constant: it changes when the PayPal
     button appears, when the webfont finishes loading, and on rotation. So
     measure the bar and follow it rather than hard-coding a number that was
     already wrong once. */
  const barEl = document.querySelector(".bar");
  const wrapEl = document.querySelector(".wrap");
  let lastBarH = 0;
  function syncBarClearance() {
    /* Falls back to the last real measurement if the bar is ever measured at
       zero, so the clearance under the list can never collapse and yank the
       page out from under a thumb. */
    const h = barEl.offsetHeight || lastBarH;
    if (h) lastBarH = h;
    wrapEl.style.paddingBottom = (h + 28) + "px";
    /* Also drives scroll-margin-bottom on the rows, so tabbing to a control
       near the end of the list does not park it underneath the bar. */
    document.documentElement.style.setProperty("--bar-h", h + "px");
  }
  if (window.ResizeObserver) {
    new ResizeObserver(syncBarClearance).observe(barEl);
  } else {
    window.addEventListener("resize", syncBarClearance);
    window.addEventListener("orientationchange", syncBarClearance);
  }
  syncBarClearance();

  /* Focusing the search field opens the on-screen keyboard, which shrinks the
     *visual* viewport but leaves the layout viewport alone — so a fixed bottom
     bar stays pinned to the bottom of the layout viewport, which is to say on
     top of the keyboard. Nobody pays mid-search, so take the bar away while
     the keyboard is up.

     visibility rather than display: the bar keeps its layout box, so
     offsetHeight above stays truthful, the clearance padding does not
     collapse, and the ResizeObserver never fires on the hide.

     Do not add `interactive-widget=resizes-content` to the viewport meta —
     it shrinks window.innerHeight in step with visualViewport.height, which
     zeroes the gap this depends on and would quietly disable it on Android. */
  const vv = window.visualViewport;
  if (vv) {
    /* 150px sits above the other things that shrink the visual viewport — the
       collapsing URL bar (~60-90px) and iOS's input accessory bar (~44px) —
       and below the shortest real keyboard (~160px, iPhone landscape). */
    const KEYBOARD_MIN = 150;
    const syncKeyboard = () => {
      /* scale guards against a pinch-zoom, which also shrinks vv.height. */
      const open = vv.scale <= 1.05 && (window.innerHeight - vv.height) > KEYBOARD_MIN;
      barEl.classList.toggle("kb-hidden", open);
    };
    vv.addEventListener("resize", syncKeyboard);
    /* iOS pans the visual viewport to keep the focused field in sight, which
       can cross the threshold without a resize. */
    vv.addEventListener("scroll", syncKeyboard);
    syncKeyboard();
  }

  load();
</script>
</body>
</html>
